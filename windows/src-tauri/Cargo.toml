[package]
name = "notchmeow"
description = "NotchMeow for Windows and Linux — Shrimpy & Momo live at the top of your screen"
authors = ["Louis Raillé", "Lorenz Tazan"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "notchmeow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Text out of PDFs (MIT). Default features off: no rayon, no chrono.
lopdf = { version = "0.45", default-features = false }
# A .docx is a zip. Reading only, with pure-Rust deflate (MIT).
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The link between the user's machines (sub-project G2). `snow` (Noise, MIT/Apache-2.0) and `mdns-sd` (mDNS, MIT/Apache-2.0) are new and were approved by the owner on 2026-10-14. The next three are
# already in Cargo.lock through other crates; naming them here adds no code to the build: `sha2` (the pairing commitment and code), `unicode-normalization` (NFC and NFKC in the file-name
# rule: the standard library has neither) and `getrandom` (nonces, device ids and transfer ids).
snow = "0.9"
mdns-sd = "0.11"
sha2 = "0.10"
unicode-normalization = "0.1"
getrandom = "0.2"

[dev-dependencies]
# Paused time, so a test can sit through minutes of silence without waiting.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# `#[implement]` (the drag source's IDropSource, platform/windows/drag.rs) writes `::windows_core::` paths, which only a direct dependency resolves. The same version the
# `windows` crate already builds on and Cargo.lock already holds, so nothing new is compiled.
windows-core = "0.61"
# The WinRT collection types the Share window's data needs (an IIterable of storage items). Microsoft's own, the one the `windows` crate below already builds on (it is in Cargo.lock
# already), named here because the `windows` crate does not re-export it.
windows-collections = "0.2"
windows = { version = "0.61", features = [
  "ApplicationModel",
  "ApplicationModel_DataTransfer",
  "Data_Pdf",
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Search",
  "Storage_Streams",
  # `SetFileInformationByHandle` (the received file is marked for deletion through its own handle, link/files.rs). A feature of the `windows` crate that is already in Cargo.lock: no new crate.
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over D-Bus, encrypted in transit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
