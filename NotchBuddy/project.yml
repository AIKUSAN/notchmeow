name: NotchBuddy
options:
  bundleIdPrefix: io.github.aikusan
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # FoundationModels (macOS 26+) is weak-linked automatically because every use is behind
    # `#available(macOS 26, *)`; scripts/check-app-binary.sh fails the build if that ever changes.
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: ""
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/NotchMeow.entitlements

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release
  NotchMeowAppStore:
    build:
      targets:
        NotchMeowAppStore: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: NotchMeow
        CFBundleDisplayName: NotchMeow
        CFBundleIdentifier: io.github.aikusan.notchmeow
        CFBundleVersion: "11"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "NotchMeow uses this to jump to your terminal, send mail and control Music or Spotify."
        NSAccessibilityUsageDescription: "NotchMeow uses this to read the active window's title and attach it as context."
        NSLocalNetworkUsageDescription: "NotchMeow uses this to reach an AI model server you added on your network, and, only if you turn on Visible on this network, to find and pair with your other Macs and PCs and send files to them."
        NSBonjourServices:
          - _notchmeow._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Quick actions in other apps (F3a-mac): Services that take the selected text and give nothing back: the source app is never changed by us.
        NSServices:
          - NSMessage: companionFix
            NSPortName: NotchMeow
            NSMenuItem:
              default: Fix with NotchMeow
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
          - NSMessage: companionRewrite
            NSPortName: NotchMeow
            NSMenuItem:
              default: Rewrite with NotchMeow
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
          - NSMessage: companionExplain
            NSPortName: NotchMeow
            NSMenuItem:
              default: Explain with NotchMeow
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aikusan.notchmeow
        PRODUCT_NAME: NotchMeow
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO

  NotchMeowAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: NotchMeow
        CFBundleDisplayName: NotchMeow
        CFBundleIdentifier: io.github.aikusan.notchmeow.store
        CFBundleVersion: "4"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
        NSLocalNetworkUsageDescription: "NotchMeow uses this to reach an AI model server you added on your network, and, only if you turn on Visible on this network, to find and pair with your other Macs and PCs and send files to them."
        NSBonjourServices:
          - _notchmeow._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Quick actions in other apps (F3a-mac): Services that take the selected text and give nothing back: the source app is never changed by us.
        NSServices:
          - NSMessage: companionFix
            NSPortName: NotchMeow
            NSMenuItem:
              default: Fix with NotchMeow
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
          - NSMessage: companionRewrite
            NSPortName: NotchMeow
            NSMenuItem:
              default: Rewrite with NotchMeow
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
          - NSMessage: companionExplain
            NSPortName: NotchMeow
            NSMenuItem:
              default: Explain with NotchMeow
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aikusan.notchmeow.store
        PRODUCT_NAME: NotchMeow
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/NotchMeowAppStore.entitlements
        DEVELOPMENT_TEAM: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        CODE_SIGNING_ALLOWED: YES
