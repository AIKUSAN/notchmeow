name: Windows tests

# Runs the Rust tests (including the shared AI contract) on Windows for pull requests and pushes to main.
# Read-only on purpose: windows.yml builds and publishes; this one only tests.

on:
  pull_request:
    paths:
      - 'windows/**'
      - 'tests/fixtures/ai/**'
      - 'tests/fixtures/cat/**'
      - 'tests/fixtures/sidekick/**'
      - 'shared/sidekick-core.js'
      - 'scripts/gen-sidekick-ts.mjs'
      - 'tests/fixtures/projects/**'
      - 'tests/fixtures/mac/projects-scenarios.json'
      - 'shared/projects-core.js'
      - 'scripts/gen-projects-ts.mjs'
      - 'shared/companion-core.js'
      - 'scripts/gen-companion-ts.mjs'
      - 'tests/fixtures/companion/**'
      - 'tests/fixtures/shelf/**'
      - 'tests/fixtures/link/**'
      - 'tests/fixtures/settings/**'
      - 'NotchBuddy/Sources/App/Settings*.swift'
      - 'NotchBuddy/Sources/App/Companion*.swift'
      - 'NotchBuddy/Sources/App/ChatSizing.swift'
      - 'tests/fake_local_llm.py'
      - 'shared/theme.json'
      - 'docs/*.html'
      - 'docs/site.css'
      - 'docs/assets/**'
      - 'scripts/check-site.sh'
      - 'scripts/test-check-site.sh'
      - '.github/workflows/windows-tests.yml'
      - 'NotchBuddy/Sources/App/PillCatalog.swift'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'tests/fixtures/ai/**'
      - 'tests/fixtures/cat/**'
      - 'tests/fixtures/sidekick/**'
      - 'shared/sidekick-core.js'
      - 'scripts/gen-sidekick-ts.mjs'
      - 'tests/fixtures/projects/**'
      - 'tests/fixtures/mac/projects-scenarios.json'
      - 'shared/projects-core.js'
      - 'scripts/gen-projects-ts.mjs'
      - 'shared/companion-core.js'
      - 'scripts/gen-companion-ts.mjs'
      - 'tests/fixtures/companion/**'
      - 'tests/fixtures/shelf/**'
      - 'tests/fixtures/link/**'
      - 'tests/fixtures/settings/**'
      - 'NotchBuddy/Sources/App/Settings*.swift'
      - 'NotchBuddy/Sources/App/Companion*.swift'
      - 'NotchBuddy/Sources/App/ChatSizing.swift'
      - 'tests/fake_local_llm.py'
      - 'shared/theme.json'
      - 'docs/*.html'
      - 'docs/site.css'
      - 'docs/assets/**'
      - 'scripts/check-site.sh'
      - 'scripts/test-check-site.sh'
      - '.github/workflows/windows-tests.yml'
      - 'NotchBuddy/Sources/App/PillCatalog.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      # Keep the files byte for byte as committed (LF): the source pins compare text, and the runner's default would check out CRLF.
      - name: Check out without line-ending conversion
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: npm ci
      - name: Site checks
        shell: bash
        run: |
          bash ../scripts/test-check-site.sh
          bash ../scripts/check-site.sh
      - name: Cat checks
        run: npm run check:cat
      - name: Claude Code chat checks
        run: npm run check:claude
      - name: Sidekick checks
        run: npm run check:sidekick
      - name: Projects checks
        run: npm run check:projects
      - name: Companion checks
        run: npm run check:companion
      - name: Link checks
        run: npm run check:link
      - name: Settings checks
        run: npm run check:settings
      - name: Test
        shell: bash
        run: |
          cargo build --release -p notchmeow-hook
          cargo test --workspace
